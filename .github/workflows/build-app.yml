name: Build detector APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/build-app.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-app
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - name: Publish to detector-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete detector-latest --yes --cleanup-tag || true
          gh release create detector-latest build/app/outputs/flutter-apk/app-release.apk \
            --prerelease --target "$GITHUB_SHA" \
            --title "進球偵測 App（最新版）" \
            --notes "由 ${GITHUB_SHA::7} 自動建置。用 Android 手機下載 app-release.apk 安裝。"
